{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CargoChains Quotation Demo{% endblock %}</title>
  <!-- Minimal Bootstrap for quick layout; replace with AdminLTE bundle in your main project -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .rounded-2xl { border-radius: 1rem; }
    .text-pre-wrap { white-space: pre-wrap; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <nav class="app-header navbar navbar-expand bg-body border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/sales/quotations/">CargoChains Demo</a>
    </div>
  </nav>
  <div class="app-wrapper">
    <aside class="app-sidebar bg-body-secondary shadow p-3 d-none d-lg-block" style="min-width: 240px;">
      <div class="fw-bold mb-2">Menu</div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/sales/quotations/">Quotations</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
      </ul>
    </aside>
    <main class="app-content" style="margin-left: 0;">
      <div class="container-fluid py-3">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.flatpickr) {
      flatpickr(".datepicker", { dateFormat: "Y-m-d", allowInput: true });
    }
  });
  </script>
</body>
</html>
